name: olist

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop2.7.4-java8
    environment:
      - CLUSTER_NAME=olist
    env_file: ./hadoop.env
    volumes:
      - namenode:/hadoop/dfs/name
    ports:
      - "50070:50070"

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop2.7.4-java8
    env_file: ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:50070"
    volumes:
      - datanode:/hadoop/dfs/data
    depends_on:
      - namenode

  hive-metastore-postgresql:
    image: bde2020/hive-metastore-postgresql:2.3.0
    volumes:
      - metastore_db:/var/lib/postgresql/data

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    env_file:
      - ./hadoop.env
      - ./hive.env
    environment:
      HIVE_SITE_CONF_javax_jdo_option_ConnectionPassword: ${HIVE_DB_PASSWORD}
      SERVICE_PRECONDITION: "namenode:50070 datanode:50075 hive-metastore-postgresql:5432"
    command: /opt/hive/bin/hive --service metastore
    depends_on:
      - namenode
      - datanode
      - hive-metastore-postgresql
    ports:
      - "9083:9083"
  spark-master:
    image: apache/spark:3.5.7
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./jars/iceberg-spark-runtime-3.5_2.12-1.11.0.jar:/opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.11.0.jar
    ports:
      - "8090:8080"
      - "7077:7077"

  spark-worker:
    image: apache/spark:3.5.7
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2g
    volumes:
      - ./jars/iceberg-spark-runtime-3.5_2.12-1.11.0.jar:/opt/spark/jars/iceberg-spark-runtime-3.5_2.12-1.11.0.jar
    depends_on:
      - spark-master

  nifi:
    image: apache/nifi:1.24.0
    environment:
      NIFI_WEB_HTTPS_HOST: 0.0.0.0
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USER}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD}
      NIFI_JVM_HEAP_INIT: 1g
      NIFI_JVM_HEAP_MAX: 1g
    ports:
      - "8443:8443"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state

volumes:
  namenode:
  datanode:
  metastore_db:
  nifi_conf:
  nifi_state: